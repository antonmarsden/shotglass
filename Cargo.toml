[package]
name = "shotglass"
version = "0.1.9"
edition = "2024"
description = "Compose short films and cartoons from GLSL shaders: shots, transitions and GPU-synthesised sound on one scrubbable timeline."
license = "MIT OR Apache-2.0"
repository = "https://github.com/antonmarsden/shotglass"
readme = "README.md"
keywords = ["glsl", "shader", "shadertoy", "animation", "demoscene"]
categories = ["multimedia", "graphics", "command-line-utilities"]
exclude = [
    "movies/*/stills",
    "*.wav",
    # SVT-AV1's docs, tests and CI files aren't needed to build it.
    "vendor/SVT-AV1/Docs",
    "vendor/SVT-AV1/test",
    "vendor/SVT-AV1/.git*",
]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.5"
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# Khronos glslang (the GLSL reference front end), built from source with `cc`: no
# system packages needed. Powers the strict, driver-independent `shotglass check`.
glslang = { version = "0.9.1", optional = true }
glutin = "0.32"
glutin-winit = "0.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
notify = "8.2.2"
# Built-in WebM export (#116): libopus, built from its bundled source (BSD-3-Clause).
opus = { version = "0.4.0", optional = true }
raw-window-handle = "0.6"
# Text (#68): font parsing and shaping (pure-Rust HarfBuzz port), bidi, line breaking.
harfrust = "0.16.1"
skrifa = "0.50.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.1"
# `shotglass fonts add` edits movie.toml in place, keeping comments and order.
toml_edit = "0.25.19"
toodee = "0.8"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
ctrlc = "3.5"
winit = "0.30"
fdsm = "0.8.0"

# Dependencies are slow unoptimised; this keeps `cargo run` snappy.
[profile.dev.package."*"]
opt-level = 2

# GPU + sound checks on fixture films; plain `main`, so it runs on the main thread
# (OpenGL windows need it).
[[test]]
name = "gpu"
harness = false

[build-dependencies]
# Built-in WebM export (#116): SVT-AV1 is built with CMake, the shim over it with cc.
cc = { version = "1.11.2", optional = true }
cmake = { version = "0.1.54", optional = true }

[features]
default = ["strict-glsl", "webm"]
# `export --format webm` without ffmpeg: SVT-AV1 (vendor/SVT-AV1, or SVT_AV1_SRC /
# SVT_AV1_DIR) + libopus, muxed by shotglass. Needs CMake, and nasm for SVT-AV1's
# SIMD on x86 (without it, a much slower C-only build). See docs/building.md.
webm = ["dep:opus", "dep:cc", "dep:cmake"]
# Strict GLSL validation in `check` (needs a C++ compiler at build time).
strict-glsl = ["dep:glslang"]

[dev-dependencies]
proptest = "1.12.0"
png = "0.18"
