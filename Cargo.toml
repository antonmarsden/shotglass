[package]
name = "shotglass"
version = "0.1.0"
edition = "2024"
description = "Compose short films and cartoons from GLSL shaders: shots, transitions and GPU-synthesised sound on one scrubbable timeline."
license = "MIT OR Apache-2.0"
repository = "https://github.com/antonmarsden/shotglass"
readme = "README.md"
keywords = ["glsl", "shader", "shadertoy", "animation", "demoscene"]
categories = ["multimedia", "graphics", "command-line-utilities"]
exclude = ["movies/*/stills", "*.wav"]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.5"
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# Khronos glslang (the GLSL reference front end), built from source with `cc`: no
# system packages needed. Powers the strict, driver-independent `shotglass check`.
glslang = { version = "0.9.1", optional = true }
glutin = "0.32"
glutin-winit = "0.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.2"
raw-window-handle = "0.6"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.2.1"
toodee = "0.8"
ctrlc = "3.5"
winit = "0.30"

# Dependencies are slow unoptimised; this keeps `cargo run` snappy.
[profile.dev.package."*"]
opt-level = 2

# GPU + sound checks on fixture films; plain `main`, so it runs on the main thread
# (OpenGL windows need it).
[[test]]
name = "gpu"
harness = false

[features]
default = ["strict-glsl"]
# Strict GLSL validation in `check` (needs a C++ compiler at build time).
strict-glsl = ["dep:glslang"]

[dev-dependencies]
proptest = "1.12.0"
