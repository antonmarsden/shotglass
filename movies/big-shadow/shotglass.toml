# Big Shadow is a project of its own: the engine contract and the libraries it uses.
shotglass = "0.1"

# Copies of the shotglass-kit files this film uses (kit commit 48313cf), kept in the
# film so the demo, and the golden tests that render it, never depend on the kit.
# Edit them here; they don't follow the kit.
[libraries]
kit = { path = "lib/kit" }
transitions = { path = "lib/transitions" }
sound = { path = "lib/sound" }
