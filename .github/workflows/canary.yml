name: Kit canary

# Checks that `shotglass new`'s template works with shotglass-kit's current main branch
# (what a new film gets). ci.yml never touches the kit: the demo keeps its own copies.
# Never runs on pushes or PRs, so it can't block a merge. A red run means: fix the kit
# or the template (see CONTRIBUTING.md, "Kit canary").
on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.100.0" # keep in step with ci.yml

jobs:
  kit-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb libgl1-mesa-dri libegl-mesa0 libxkbcommon-x11-0 ffmpeg
      - run: cargo build --release
      - name: The template on kit main: strict check, a frame, strip and soundtrack (software OpenGL)
        run: xvfb-run -a .github/canary.sh
      - name: Upload the strip, soundtrack and lock
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kit-canary-failures
          path: |
            target/tmp/canary/*.png
            target/tmp/canary/*.wav
            target/tmp/canary/*/shotglass.lock
          if-no-files-found: ignore
