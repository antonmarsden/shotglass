name: Kit canary

# Tests the engine against shotglass-kit's current main branch instead of the commit
# pinned in movies/big-shadow/shotglass.lock (what ci.yml's tests use), so drift between
# pin bumps shows up. Never runs on pushes or PRs, so it can't block a merge. A red run
# means: bump the pin and re-bless, or fix the kit (see CONTRIBUTING.md, "CI").
on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch:
  push: # TEMPORARY: verify on this branch (dispatch needs the file on main); remove before merge
    branches: [claude/jolly-wozniak-et33y4]

env:
  RUST_TOOLCHAIN: "1.100.0" # keep in step with ci.yml

jobs:
  kit-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb libgl1-mesa-dri libegl-mesa0 libxkbcommon-x11-0 ffmpeg
      - run: cargo build --release
      - name: Strict GLSL check and golden strips / soundtracks on kit main (software OpenGL)
        run: xvfb-run -a .github/canary.sh
      - name: Upload the actual and diff images / WAVs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kit-canary-failures
          path: |
            target/tmp/canary/*.png
            target/tmp/canary/*.wav
            target/tmp/canary/*/shotglass.lock
          if-no-files-found: ignore
