name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb libgl1-mesa-dri libegl-mesa0
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - name: Render the demo movie headlessly (software OpenGL)
        run: |
          cargo build --release
          xvfb-run -a ./target/release/shotglass check movies/big-shadow --size 320x180 --frames 1
          xvfb-run -a ./target/release/shotglass strip movies/big-shadow --count 8 --size 320x180 --out strip.png
      - uses: actions/upload-artifact@v4
        with:
          name: big-shadow-strip
          path: strip.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
