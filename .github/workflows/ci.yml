name: CI

on:
  push:
  pull_request:

# Rust is pinned so a new release (with new clippy lints) can't turn CI red on its
# own. To upgrade: bump this, fix any new warnings locally, commit both together.
env:
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb libgl1-mesa-dri libegl-mesa0 libxkbcommon-x11-0 ffmpeg
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - name: Clippy without the strict GLSL checker (glslang)
        run: cargo clippy --no-default-features -- -D warnings
      # The selftest's fixture films must also pass the strict GLSL check (330 and ES),
      # and the unit tests run it on the demo, the template and the built-in transitions.
      # Includes the golden tests (tests/golden.rs): strips and soundtracks of the demo
      # and the template compared with tests/golden/*.png and *.wav.
      - name: Unit tests, GPU selftest, golden images and soundtracks (software OpenGL)
        run: xvfb-run -a cargo test
      - name: Upload the actual and diff images / WAVs of failed golden tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-failures
          path: |
            target/tmp/golden/*.png
            target/tmp/golden/*.wav
          if-no-files-found: ignore
      - name: Render the demo movie headlessly (software OpenGL)
        run: |
          cargo build --release
          xvfb-run -a ./target/release/shotglass check movies/big-shadow --web --size 320x180 --frames 1
          xvfb-run -a ./target/release/shotglass strip movies/big-shadow --count 8 --size 320x180 --out strip.png
          xvfb-run -a ./target/release/shotglass export movies/big-shadow --size 320x180 --out big-shadow.webm
      - name: Strict GLSL check (glslang, no GPU) on the demo movie and the template
        run: |
          ./target/release/shotglass check movies/big-shadow --web --no-gpu
          ./target/release/shotglass new "$RUNNER_TEMP/template"
          ./target/release/shotglass check "$RUNNER_TEMP/template" --web --no-gpu
      - uses: actions/upload-artifact@v4
        with:
          name: big-shadow-strip
          path: |
            strip.png
            big-shadow.webm

  windows:
    runs-on: windows-latest
    env:
      # Mesa's software OpenGL (below) uses llvmpipe; say so in case another driver is found.
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # GitHub's Windows machines have no usable OpenGL of their own: install Mesa's
      # (mesa-dist-win, llvmpipe), the same software renderer the Linux job uses.
      - uses: ssciwr/setup-mesa-dist-win@v2
      - run: cargo clippy -- -D warnings
      - name: Unit tests, GPU selftest, golden images and soundtracks (software OpenGL)
        run: cargo test
      - name: Upload the actual and diff images / WAVs of failed golden tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-failures-windows
          path: |
            target/tmp/golden/*.png
            target/tmp/golden/*.wav
          if-no-files-found: ignore
      - run: cargo build --release
      # Needs no OpenGL (and proves glslang builds with MSVC).
      - name: Strict GLSL check on the demo movie and the template
        shell: bash
        run: |
          ./target/release/shotglass check movies/big-shadow --web --no-gpu
          ./target/release/shotglass new "$RUNNER_TEMP/template"
          ./target/release/shotglass check "$RUNNER_TEMP/template" --web --no-gpu

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings
      # macOS runners have Apple's OpenGL 4.1 (on Metal), so the GPU selftest and the
      # golden tests run here, against the same llvmpipe references.
      - name: Unit tests, GPU selftest, golden images and soundtracks
        run: cargo test
      - name: Upload the actual and diff images / WAVs of failed golden tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-failures-macos
          path: |
            target/tmp/golden/*.png
            target/tmp/golden/*.wav
          if-no-files-found: ignore
      - run: cargo build --release
      - name: Strict GLSL check on the demo movie and the template
        run: |
          ./target/release/shotglass check movies/big-shadow --web --no-gpu
          ./target/release/shotglass new "$RUNNER_TEMP/template"
          ./target/release/shotglass check "$RUNNER_TEMP/template" --web --no-gpu
