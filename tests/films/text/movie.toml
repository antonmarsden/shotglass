# Golden-image film for text (tests/golden.rs, #68): a coverage-only title, the same
# title's distance field magnified 4× with an outline and a glow, its baseline drawn
# from iChannelMeta, a wrapped centred paragraph on iChannel6 and a mixed
# right-to-left line (Hebrew, Arabic, Latin) on iChannel7. Shaders are film-local, so
# the golden only moves when the engine does.
title = "text"
fps = 30

[fonts]
sans = { file = "fonts/NotoSans-subset.ttf", licence = "OFL-1.1", fallback = ["hebrew", "arabic"] }
bold = { file = "fonts/NotoSans-subset.ttf", variations = { wght = 800 }, licence = "OFL-1.1" }
hebrew = { file = "fonts/NotoSansHebrew-subset.ttf", licence = "OFL-1.1" }
arabic = { file = "fonts/NotoNaskhArabic-subset.ttf", licence = "OFL-1.1" }

[texts]
title = { text = "Big Shadow", font = "bold", size = 96, sdf_spread = 10 }
para = { text = "a tiny mouse, a tealight, and a lot of wall", font = "sans", size = 40, width = 420, align = "center", line_height = 1.3 }
mixed = { text = "שלום — مرحبا — hello", font = "sans", size = 44 }

[[shot]]
id = "title"
scene = "scenes/title.glsl"
duration = 2.0
channels = ["title"]
uniforms.uIn = { keys = [[0.0, 0.0], [1.0, 1.0]], ease = "smooth" }

[[shot]]
id = "words"
scene = "scenes/words.glsl"
duration = 2.0
channels = ["", "", "", "", "", "", "para", "mixed"]
