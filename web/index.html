<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shotglass</title>
  <!-- trunk: build the shotglass binary for wasm32, and ship the demo film next to it. -->
  <link data-trunk rel="rust" href="../Cargo.toml" data-bin="shotglass">
  <link data-trunk rel="copy-dir" href="../movies/big-shadow">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #080808; color: #ddd;
      font: 15px/1.4 system-ui, sans-serif; }
    #player { display: block; width: 100%; height: 100%; }
    #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center; background: #080808; padding: 0 16px;
      text-align: center; }
    #start[hidden] { display: none; }
    #start h1 { margin: 0; font-weight: 600; letter-spacing: 0.02em; }
    #status { margin: 0; max-width: 60ch; color: #aaa; white-space: pre-wrap; overflow-wrap: anywhere; }
    #play { font: inherit; font-size: 18px; padding: 10px 28px; border-radius: 6px; border: 0;
      background: #e8e8e8; color: #111; cursor: pointer; }
    #play:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>
  <canvas id="player"></canvas>
  <!-- Browsers only start audio after a click, so playback starts from this button. -->
  <div id="start">
    <h1>shotglass</h1>
    <p id="status">Loading…</p>
    <button id="play" disabled>▶ Play</button>
    <noscript>The shotglass player needs JavaScript and WebAssembly.</noscript>
  </div>
</body>
</html>
