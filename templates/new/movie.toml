# A new shotglass movie. Save any file while `shotglass play` is open and it reloads.
# Libraries and the engine contract are in shotglass.toml, next to this file.
title = "My short"
aspect = [16, 9]
fps = 30                  # or 29.97, or "30000/1001"
# Shaders compile as GLSL 3.30 everywhere, so the film runs on any OpenGL 3.3 machine.
# glsl = "430"           # opt in to a later GLSL ("410" or "430"); fewer machines run it
# loop = true             # play forever (shotglass = "0.1.2" in shotglass.toml); see docs/loop-films.md

[sound]
music = "music.glsl"      # vec2 mainSound(int samp, float time); time = movie time
# mix = "mix.glsl"        # optional final pass: vec2 mainMix(int samp, float time)
volume = 0.8

[[shot]]
id = "first"
scene = "scenes/first.glsl"
duration = 5.0
# Uniforms are declared for you. Constants, vectors, or keyframes in shot-local seconds.
uniforms.uHue = { keys = [[0, 0.0], [5, 0.3]], ease = "smooth" }
# Images or texts on iChannel0..7 (PNG or JPEG; shotglass = "0.1.1" in shotglass.toml, "0.1.3"
# for text or channels 4–7). See docs/channels.md in shotglass.
# channels = ["textures/brick.png", "", { file = "textures/grid.png", filter = "nearest", wrap = "clamp" }]

[[shot]]
id = "second"
scene = "scenes/second.glsl"
duration = 5.0
# The transition *into* this shot, from shotglass-kit (see [libraries] in shotglass.toml):
# transitions/crossfade, fade, iris, dissolve, wipe. Or a file of your own: "fx/my.glsl".
transition = { type = "transitions/iris", duration = 1.2, freeze = true, params = { center = [0.5, 0.5] } }
# This shot's own sound: time is shot-local. sound_lead / sound_tail (seconds)
# start it early or let it ring on; otherwise it fades with the transitions.
sound = "sfx/chime.glsl"

# A layer over a span of the film (shotglass = "0.1.4"; see docs/layers.md):
# [[layer]]
# id = "title"
# scene = "layers/title.glsl"   # mainImage writes vec4(colour, alpha)
# from = "first"
# to = "second.settled"
# fade = [0.5, 0.5]
# matte = { source = "@letters", channel = "luma" }   # cut out by a comp (0.1.7)
#
# Comps, sequences of shots and layers in their own files (shotglass = "0.1.7"; see docs/layers.md):
# [comps]
# intro = "comps/intro.toml"
# tv = { file = "comps/tv.toml", size = [320, 180], loop = true }
# and a shot `comp = "intro"`, a layer `comp = "tv"` or a channel "@tv".
#
# A feedback buffer, state kept from frame to frame (shotglass = "0.1.9"; see docs/buffers.md):
# [[buffer]]
# id = "trail"
# scene = "buffers/trail.glsl"
# scale = 0.5
# channels = ["@prev", "@picture"]
# cache = "dense"            # checkpoint every frame: frame-by-frame scrubbing of a short passage
# preview_lookback = 2.0     # player only: approximate a far scrub from the last 2 s (forgetful effects)
# and a layer channel "@trail".
# A comp file may have [[buffer]]s too (shotglass = "0.1.10"): they fold over the comp's own
# frames, and such a comp is shown in one place only.
#
# Text, bound to channels like a texture (shotglass = "0.1.3"; see docs/channels.md, "Text"):
# `shotglass fonts add "Inter"` (in the film folder) adds a Google Fonts family and writes, e.g.:
# [fonts]
# inter = "<inter/Inter[opsz,wght].ttf>"
# [texts]
# title = { text = "My Film", font = "inter", size = 128 }
# Glyph runs (each glyph on its own, for per-letter animation), glyph sets and subtitles
# (shotglass = "0.1.8"; see docs/channels.md, "Glyph runs"):
# credits = { file = "credits.txt", font = "inter", size = 48, align = "center", glyphs = true }
# digits = { glyphs = "0123456789:.", set = true, font = "inter" }
# subs = { subtitles = "subs.vtt", font = "inter", size = 56, width = 1600, glyphs = true }
# ...and in a shot or layer: channels = ["credits", { text = "credits", part = "glyphs" }]
#
# Named textures, for images several shots use or that have options:
# [textures]
# brick = "textures/brick.png"
# noise = { file = "<kit/textures/noise.png>", filter = "linear" }   # from a library
# Image sequences, one file per frame (shotglass = "0.1.6"; see docs/channels.md, "Footage"):
# fog = "renders/fog_####.png"
# plate = { frames = "renders/plate_####.jpg", fps = 24, first = 1001, end = "loop" }
# and in a shot, re-timed: channels = [{ texture = "plate", in = 2.0, speed = 0.5, clock = "shot" }]
